<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poradnik HTML</title>
</head>
<body style="display: flex; margin: 0; min-height: 100vh;">

    <!-- Szary klocek po lewej stronie -->
    <div style="width: 100px; background-color: #888888; flex-shrink: 0;"></div>

    <!-- Treść strony po prawej stronie -->
    <div style="padding: 20px;">
        <h1>Poradnik HTML</h1>

        <h2>Co to jest HTML?</h2>
        <p>HTML (HyperText Markup Language) to podstawowy język znaczników używany do tworzenia i strukturyzowania stron internetowych. Pozwala on na rozmieszczanie tekstu, nagłówków, obrazków oraz linków na stronie.</p>
    </div>

</body>
